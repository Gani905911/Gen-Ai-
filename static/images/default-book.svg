<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="accentSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Cover background -->
  <rect width="300" height="450" rx="12" fill="url(#bookCoverGrad)" />

  <!-- Book Spine highlight on the left -->
  <rect x="0" y="0" width="18" height="450" rx="3" fill="url(#accentSpine)" opacity="0.8" />
  <line x1="22" y1="0" x2="22" y2="450" stroke="#334155" stroke-width="2" />

  <!-- Decorative geometric pattern -->
  <circle cx="160" cy="170" r="70" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.2" />
  <circle cx="160" cy="170" r="50" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,4" />

  <!-- Center Book Icon -->
  <g transform="translate(130, 140)">
    <path d="M5 45V15C5 15 15 10 30 10C45 10 55 15 55 15V45C55 45 45 40 30 40C15 40 5 45 5 45Z" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M55 15C55 15 65 10 80 10C95 10 105 15 105 15V45C105 45 95 40 80 40C65 40 55 45 55 45" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="160" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">
    SMART LIBRARY
  </text>
  <text x="160" y="285" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="2" fill="#94A3B8">
    COVER NOT AVAILABLE
  </text>

  <!-- Subtle bottom tag -->
  <rect x="75" y="380" width="170" height="28" rx="14" fill="#1E293B" stroke="#334155" />
  <text x="160" y="398" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">
    Google Books Edition
  </text>
</svg>

