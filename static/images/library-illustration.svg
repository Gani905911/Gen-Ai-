<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" /><stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" /><stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="book3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" /><stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <linearGradient id="book4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" /><stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="book5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" /><stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="700" fill="url(#bgGrad)" />

  <!-- Ambient glowing orbs -->
  <circle cx="150" cy="200" r="140" fill="url(#glowGrad)" />
  <circle cx="450" cy="500" r="180" fill="url(#glowGrad)" />

  <!-- Bookshelf Section 1 -->
  <rect x="80" y="220" width="440" height="14" rx="4" fill="#334155" />
  <!-- Books on shelf 1 -->
  <rect x="110" y="80" width="35" height="140" rx="4" fill="url(#book1)" />
  <rect x="150" y="100" width="28" height="120" rx="4" fill="url(#book2)" />
  <rect x="183" y="70" width="40" height="150" rx="4" fill="url(#book3)" />
  <rect x="228" y="110" width="30" height="110" rx="4" fill="url(#book4)" />
  <rect x="263" y="90" width="36" height="130" rx="4" fill="url(#book5)" />
  <!-- Leaning book -->
  <g transform="translate(305, 115) rotate(18)">
    <rect x="0" y="0" width="32" height="125" rx="4" fill="url(#book1)" />
  </g>
  <rect x="365" y="85" width="38" height="135" rx="4" fill="url(#book2)" />
  <rect x="408" y="105" width="32" height="115" rx="4" fill="url(#book4)" />
  <rect x="445" y="75" width="42" height="145" rx="4" fill="url(#book3)" />

  <!-- Bookshelf Section 2 -->
  <rect x="80" y="440" width="440" height="14" rx="4" fill="#334155" />
  <!-- Stack of books horizontal -->
  <rect x="110" y="415" width="120" height="25" rx="3" fill="url(#book5)" />
  <rect x="120" y="390" width="105" height="25" rx="3" fill="url(#book1)" />
  <rect x="128" y="365" width="90" height="25" rx="3" fill="url(#book2)" />

  <!-- Vertical books shelf 2 -->
  <rect x="250" y="300" width="36" height="140" rx="4" fill="url(#book3)" />
  <rect x="290" y="320" width="32" height="120" rx="4" fill="url(#book4)" />
  <rect x="326" y="280" width="42" height="160" rx="4" fill="url(#book1)" />
  <rect x="373" y="310" width="30" height="130" rx="4" fill="url(#book5)" />
  <rect x="408" y="295" width="38" height="145" rx="4" fill="url(#book2)" />

  <!-- Floating particles / Stars -->
  <circle cx="100" cy="60" r="2" fill="#F8FAFC" opacity="0.6" />
  <circle cx="500" cy="140" r="3" fill="#FBBF24" opacity="0.8" />
  <circle cx="480" cy="380" r="2.5" fill="#60A5FA" opacity="0.7" />
  <circle cx="80" cy="320" r="2" fill="#A78BFA" opacity="0.6" />
  <circle cx="280" cy="40" r="3" fill="#38BDF8" opacity="0.7" />

  <!-- Open AI glowing book symbol at center bottom -->
  <g transform="translate(230, 500)">
    <circle cx="70" cy="60" r="65" fill="#1E293B" stroke="#3B82F6" stroke-width="2" />
    <path d="M40 70V45C40 45 52 40 70 40C88 40 100 45 100 45V70C100 70 88 65 70 65C52 65 40 70 40 70Z" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linejoin="round" />
    <path d="M70 45V65" stroke="#60A5FA" stroke-width="3" />
    <path d="M70 30L73 36L79 37L75 41L76 47L70 44L64 47L65 41L61 37L67 36Z" fill="#FBBF24" />
  </g>
</svg>

